---
title: Dictum

help: Dictum API

endpoints:
  /((map)|(comp))/.*\.gz:
    get:
      headers: {Content-Encoding: gzip}
      handler: pass

  /api/words/{word}:
    args:
      word: {type: string}

    get:
      fields: ['*', 'tags']
      sql: CALL GetWord({session.id}, {args.word})

  /api/words/{word}/tags/{tag}:
    args:
      word: {type: string}
      tag: {type: string}

    put:
      sql: CALL TagWord({session.id}, {args.word}, {args.tag})

    delete:
      sql: CALL UntagWord({session.id}, {args.word}, {args.tag})

  /api/words/{word}/notes:
    args:
      word: {type: string}

    put:
      args:
        notes: {type: string}
      sql: CALL SetWordNotes({session.id}, {args.word}, {args.notes})

  /api/words/{word}/score:
    args:
      word: {type: string}

    put:
      args:
        score: {type: s8, help: 'Word score'}
      sql: CALL SetWordScore({session.id}, {args.word}, {args.score})

  /api/tags:
    get:
      return: list
      sql: CALL GetTags({session.id})

  /api/user/tags:
    get:
      return: list
      sql: CALL GetUserTags({session.id})

  /api/user/tags/{tag}:
    args:
      tag: {type: string}

    put:
      sql: CALL AddUserTag({session.id}, {args.tag})

    delete:
      sql: CALL DeleteUserTag({session.id}, {args.tag})

  /api/user/history:
    get:
      return: list
      sql: CALL GetUserHistory({session.id})

  /api/user/tag/{uid}/{tag}:
    args:
      uid: {type: u32}
      tag: {type: string}

    get:
      return: list
      sql: CALL GetTag({session.id}, {args.uid}, {args.tag})

  /api/tag/{tag}:
    args:
      tag: {type: string}

    get:
      return: list
      sql: CALL GetTag({session.id}, NULL, {args.tag})

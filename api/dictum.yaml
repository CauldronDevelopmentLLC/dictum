---
title: Dictum

help: Dictum API

endpoints:
  /((map)|(comp))/.*\.gz:
    GET:
      headers: {Content-Encoding: gzip}
      handler: pass

  /api/words/:word:
    args:
      word: {type: string}

    GET:
      fields: ['*', 'tags']
      sql: CALL GetWord(%(session.id)S, %(args.word)S)

  /api/words/:word/tags/:tag:
    args:
      word: {type: string}
      tag: {type: string}

    PUT:
      sql: CALL TagWord(%(session.id)S, %(args.word)S, %(args.tag)S)

    DELETE:
      sql: CALL UntagWord(%(session.id)S, %(args.word)S, %(args.tag)S)

  /api/words/:word/notes:
    args:
      word: {type: string}

    PUT:
      args:
        notes: {type: string}
      sql: CALL SetWordNotes(%(session.id)S, %(args.word)S, %(args.notes)S)

  /api/words/:word/score:
    args:
      word: {type: string}

    PUT:
      args:
        score: {type: s8, help: 'Word score'}
      sql: CALL SetWordScore(%(session.id)S, %(args.word)S, %(args.score)i)

  /api/tags:
    GET:
      return: list
      sql: CALL GetTags(%(session.id)S)

  /api/user/tags:
    GET:
      return: list
      sql: CALL GetUserTags(%(session.id)S)

  /api/user/tags/:tag:
    args:
      tag: {type: string}

    PUT:
      sql: CALL AddUserTag(%(session.id)S, %(args.tag)S)

    DELETE:
      sql: CALL DeleteUserTag(%(session.id)S, %(args.tag)S)

  /api/user/history:
    GET:
      return: list
      sql: CALL GetUserHistory(%(session.id)S)

  /api/user/tag/:uid/:tag:
    GET:
      return: list
      sql: CALL GetTag(%(session.id)S, %(args.uid)u, %(args.tag)S)

  /api/tag/:tag:
    GET:
      return: list
      sql: CALL GetTag(%(session.id)S, NULL, %(args.tag)S)

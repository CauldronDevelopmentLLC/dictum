---
title: Authorization

help: >
  API Authorization login system uses OAuth2 and can support Google, Facebook,
  or GitHub as login providers.

endpoints:
  /api/.*:
    get|put|post|delete:
      handler: session
      help: Look up session by ID.
      sql: CALL AuthSession({session.id})

  /api/login/{provider}:
    get:
      handler: login
      headers: {Cache-Control: max-age=0}
      args:
        provider:
          enum: [google, facebook, github, providers, '']
          help: >
            The OAuth2 login provider or ``providers`` to list supported
            providers.
        redirect_uri: {type: uri, optional: true}

      sql: >
        CALL AuthLogin({session.id}, {session.provider},
          {session.provider_id}, {session.user}, {session.name},
          {session.avatar})

  /api/logout:
    put:
      handler: logout
      sql: CALL AuthLogout({session.id})
      help: Close the currently logged in session.
